name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: Unit, invariant and end-to-end fixture tests
        # tests use synthetic fixtures only; no data download
        run: uv run pytest -W error::RuntimeWarning
